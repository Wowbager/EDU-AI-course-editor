# Type check and unit tests on every push to main and every PR, so a commit that
# breaks them shows up before anyone builds on it. The e2e suite runs locally only
# (AGENTS.md → "Before you push"): it is slow, and without the Flutter player it
# would skip the preview suites anyway.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
