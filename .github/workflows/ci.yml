# Everything that can run without a Flutter toolchain, on every push to main and
# every PR, so a commit that breaks it shows up before anyone builds on it:
# the type check, the unit tests, and the `editor` Playwright project.
#
# The `editor` project is every suite about the editor (12 files, ~113 tests) with a
# fake player in the preview column, so it needs no player build — `vite build` and
# the run both succeed with `PLAYER_BUILD` pointing nowhere. It used to be excluded
# along with the `player` project, which was one job then and skipped the preview
# suites without Flutter anyway. The projects are separate now, and this half is the
# clicky layer (`check` and `npm test` cannot see a broken label or a lost focus),
# which is what the round-9 commits kept fixing by hand.
#
# What stays local: the `player` project (`e2e/preview*.spec.ts`, the real Flutter
# build, ~11 MB of JS and several MB of wasm per page). It skips without a build;
# `REQUIRE_PLAYER=1` turns that skip into a failure, and it is the flag to use when
# the preview itself is what changed. See AGENTS.md → Checks.
#
# `run-dev` and `run-docker` start the editor the two ways README tells people to:
# the first loads the page in a browser (`scripts/smoke.mjs`), the second only checks
# that the image starts and serves the page and the player (curl). Every other job runs the built
# editor under `vite preview`, which nobody runs for real: a dev server that answers
# every page with a 500, or an image whose nginx serves the player from the wrong
# root (OPEN-PROBLEMS #40), passed all of them. A runner always installs from scratch,
# so the commonest local cause of that 500 — a pull that added a dependency, and no
# `npm install` after it — is caught by `scripts/check-install.mjs` before `npm run
# dev` starts, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  # The editor's own clicky behaviour, in a real browser. Separate from `check` so a
  # slow browser job never hides a type error, and so the two can be read apart.
  # No `REQUIRE_PLAYER` here: a missing player build is the intended state on a
  # runner, and the `player` project skipping is correct.
  e2e-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The distro's Chromium dependencies, then the browser.
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds the editor itself (`npm run build && npm run
      # preview` on 5178) unless E2E_DEV is set, so there is nothing to start here.
      - run: npx playwright test --project=editor
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # `npm run dev -- --host`, as a person starts it. `--host` because that is how it was
  # run when a 500 on every page was found, and it binds every interface rather than
  # only localhost, which is the less-trodden path.
  run-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run dev -- --host --strictPort > dev.log 2>&1 &
      - run: npm run smoke -- http://localhost:5173/
      - if: failure()
        run: cat dev.log

  # The image, built from this commit and started as deployed: nginx in front, the
  # Node server behind it, the player cloned and built at PLAYER_REF. Only a smoke test
  # that it starts and serves — no browser, no npm install; the editor's behaviour is
  # `e2e-editor`'s job. The Flutter stage is the slow part and changes only with
  # PLAYER_REF, so it comes from the Actions cache.
  run-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: edu-editor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run -d --name editor -p 8080:8080 edu-editor:ci
      # The page; then the player, which only the image serves through nginx: its index
      # with the image shim spliced in, and canvaskit.wasm as wasm — the asset nginx once
      # served from the wrong root (OPEN-PROBLEMS #40).
      - name: Smoke test
        run: |
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o page.html http://localhost:8080/
          grep -q 'lang="cs"' page.html
          curl -fsS http://localhost:8080/player/ | grep -q 'edu-preview-image-shim:start'
          curl -fsS -o /dev/null -w '%{content_type}' http://localhost:8080/player/canvaskit/canvaskit.wasm | grep -qx 'application/wasm'
      - if: failure()
        run: docker logs editor
