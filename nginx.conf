# The editor and the player share one origin.
#
# That is not a deployment convenience: the preview is an iframe that exchanges
# messages with the page around it, and same-origin is what lets the editor read
# `event.source`, post to `window.location.origin` rather than `*`, and keep the
# player's own storage out of the student's.
#
#   /player/  → the Flutter web build (the real player, in preview mode)
#   /api/     → the Laravel API, with the session cookie passed through
#   /         → the SvelteKit editor (adapter-node)

upstream editor {
    server 127.0.0.1:3000;
}

server {
    listen $PORT;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm;
    gzip_min_length 256;

    # The player's files are compressed once, when the image is built
    # (scripts/precompress.mjs): a `.br` and a `.gz` beside each. These serve them
    # as they are, brotli to the browsers that ask for it, and fall back to the
    # on-the-fly gzip above for anything without a copy. The editor's own assets
    # come precompressed from adapter-node through the proxy.
    brotli_static on;
    gzip_static on;

    # ── The player ──────────────────────────────────────────────────────────
    # Two kinds of URL (scripts/version-player.mjs):
    #
    #   /player/<anything>        the page, index.html, whose <base href> names the
    #                             build: /player/preview is the editor's iframe
    #   /player/<hash>/<file>     every other file of that build, where <hash> is
    #                             taken from the files themselves
    #
    # No Flutter file has a version in its own name (`main.dart.js`,
    # `canvaskit.wasm`), so the build's directory carries it instead. The page is
    # revalidated on every load and is all that changes when the player does; the
    # files under a hash never change, so a browser keeps them for good and does not
    # ask again. A new build is a new hash. Before this, the files sat at fixed URLs
    # and were sent `immutable` for a year: after a `PLAYER_REF` bump a returning
    # browser could run the new `main.dart.js` on the old CanvasKit.
    location /player/ {
        alias /usr/share/nginx/player/;
        try_files $uri /player/index.html;
        add_header Cache-Control "no-cache";

        # The preview is embedded by the editor on this same origin, and by nobody
        # else.
        add_header Content-Security-Policy "frame-ancestors 'self'";
        add_header X-Frame-Options "SAMEORIGIN";
    }

    # The file path is captured by name rather than left as a directory `alias`:
    # a regex location with a directory alias makes nginx append a trailing slash
    # (301 → `…/canvaskit.wasm/`) and serve something else, which reads as a working
    # request and hands Flutter the wrong bytes. A file that is not in the build is a
    # 404 here, never the page: an HTML fallback cached as immutable would be wrong
    # for a year.
    # Quoted, because nginx reads an unquoted `{` in the regex as the block's start.
    location ~ "^/player/(?<build>[0-9a-f]{16})/(?<file>.+)$" {
        alias /usr/share/nginx/player/$build/$file;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── The API ─────────────────────────────────────────────────────────────
    # Proxied rather than called cross-origin, so the editor sends the session
    # cookie without a second auth scheme in the browser.
    location /api/ {
        proxy_pass $API_URL/api/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # Publishing a course sends the whole document.
        client_max_body_size 32m;
        proxy_read_timeout 120s;
    }

    # ── The editor ──────────────────────────────────────────────────────────
    location / {
        # A saved version (POST /versions/…) is a whole course.
        client_max_body_size 8m;
        proxy_pass http://editor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
