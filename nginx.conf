# The editor and the player share one origin.
#
# That is not a deployment convenience: the preview is an iframe that exchanges
# messages with the page around it, and same-origin is what lets the editor read
# `event.source`, post to `window.location.origin` rather than `*`, and keep the
# player's own storage out of the student's.
#
#   /player/  → the Flutter web build (the real player, in preview mode)
#   /api/     → the Laravel API, with the session cookie passed through
#   /         → the SvelteKit editor (adapter-node)

upstream editor {
    server 127.0.0.1:3000;
}

server {
    listen $PORT;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm;
    gzip_min_length 256;

    # The player's files are compressed once, when the image is built
    # (scripts/precompress.mjs): a `.br` and a `.gz` beside each. These serve them
    # as they are, brotli to the browsers that ask for it, and fall back to the
    # on-the-fly gzip above for anything without a copy. The editor's own assets
    # come precompressed from adapter-node through the proxy.
    brotli_static on;
    gzip_static on;

    # ── The player ──────────────────────────────────────────────────────────
    # Built with `--base-href /player/`. Every unknown path under it falls back to
    # the Flutter index, so /player/preview is served by the SPA router.
    #
    # No file of the player has a version in its name: `main.dart.js` and
    # `canvaskit.wasm` are called that in every build. So nothing under /player/ may be
    # cached without asking. A browser that kept CanvasKit for a year (as this file
    # once said) would, after a `PLAYER_REF` bump, run the new `main.dart.js` on the
    # old engine. `no-cache` keeps the copy and asks each time; an unchanged file is a
    # 304 with no body.
    location /player/ {
        alias /usr/share/nginx/player/;
        try_files $uri $uri/ /player/index.html;
        add_header Cache-Control "no-cache";

        # The preview is embedded by the editor on this same origin, and by nobody
        # else.
        add_header Content-Security-Policy "frame-ancestors 'self'";
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location ~ ^/player/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ {
        alias /usr/share/nginx/player/$1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Assets the player loads at runtime — CanvasKit's wasm above all. Without an
    # `alias` here this block matched `/player/…` but served from nginx's *default*
    # root (`/usr/share/nginx/html`), so every png/ico/woff/wasm under `/player/`
    # was a 404: the page loaded, CanvasKit did not, and the preview stayed blank.
    #
    # The asset path is captured by name rather than left as `alias …/player/;`,
    # because a regex location with a directory alias makes nginx append a trailing
    # slash (301 → `…/canvaskit.wasm/`) and then fall back to the index, which reads
    # as a working request and still hands Flutter the wrong bytes. With `$asset`
    # the request resolves straight to the file.
    location ~* ^/player/(?<asset>.+\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wasm))$ {
        alias /usr/share/nginx/player/$asset;
        add_header Cache-Control "no-cache";
    }

    # ── The API ─────────────────────────────────────────────────────────────
    # Proxied rather than called cross-origin, so the editor sends the session
    # cookie without a second auth scheme in the browser.
    location /api/ {
        proxy_pass $API_URL/api/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # Publishing a course sends the whole document.
        client_max_body_size 32m;
        proxy_read_timeout 120s;
    }

    # ── The editor ──────────────────────────────────────────────────────────
    location / {
        # A saved version (POST /versions/…) is a whole course.
        client_max_body_size 8m;
        proxy_pass http://editor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
